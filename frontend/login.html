<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理员登录 · 腾讯会议预约中心</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page">
  <div class="auth-card card">
    <span class="eyebrow">ADMIN</span><h1>管理后台登录</h1><p>请输入管理员账号。</p>
    <form id="loginForm">
      <label class="field"><span>用户名</span><input name="username" value="admin" required></label>
      <label class="field"><span>密码</span><input name="password" type="password" required></label>
      <button class="primary-btn" type="submit">登录</button>
      <div class="form-error" id="loginError"></div>
    </form>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
